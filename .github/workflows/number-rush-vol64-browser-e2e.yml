name: NUMBER RUSH Vol64 Same-Key Chromium E2E
on:
  workflow_dispatch:
jobs:
  indexeddb-two-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Same-question concurrent commit E2E
        run: node tools/browser-e2e-vol64.mjs
