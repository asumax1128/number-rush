name: NUMBER RUSH Vol60 Browser E2E
on:
  workflow_dispatch:
jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real-browser TRIPLE telemetry fixture
        run: node tools/browser-e2e-vol60.mjs
