name: NUMBER RUSH Vol.51 Full Partition Batch (Provisional)
on:
  workflow_dispatch:
jobs:
  verify-partitions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Compile verifier
        run: g++ -O3 -std=c++17 -Wall -Wextra tools/verify-vol41.cpp -o /tmp/verify51
      - name: Verify assigned 24 full-queue partitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          batch=${{ matrix.batch }}
          start=$((batch * 24))
          stop=$((start + 24))
          : > results/summary.tsv
          for ((i=start;i<stop;i++)); do
            b=$((i * 243))
            e=$((b + 243))
            log="results/partition-$(printf '%03d' "$i").log"
            /usr/bin/time -f 'elapsed_seconds=%e peak_rss_kb=%M' -o "${log}.timing" /tmp/verify51 "$b" "$e" 0 46656 > "$log"
            grep -q '^RESULT: no FREE counterexample in tested partition$' "$log"
            grep -Eq '^FREE valid=[0-9]+ zero=0$' "$log"
            python3 tools/parse-vol51-partition.py "$log" "$i" >> results/summary.tsv
          done
          test "$(wc -l < results/summary.tsv)" -eq 24
          python3 tools/parse-vol51-partition.py --validate-batch results/summary.tsv "$batch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vol51-batch-${{ matrix.batch }}
          path: results/
          retention-days: 14
  aggregate:
    if: always()
    needs: [verify-partitions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vol51-batch-*
          path: collected
      - name: Verify all 192 partitions and aggregate results
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.verify-partitions.result }}" = success
          find collected -name summary.tsv -print0 | xargs -0 cat > full-summary.tsv
          python3 tools/parse-vol51-partition.py --aggregate full-summary.tsv
