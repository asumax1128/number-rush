name: NUMBER RUSH Safety Verification
on:
  push:
    paths:
      - 'tools/verify-vol32.cpp'
      - 'tools/verify-vol33.cpp'
      - 'tools/verify-vol34.cpp'
      - 'tools/verify-vol35.cpp'
      - 'tools/verify-vol36.py'
      - 'tools/verify-vol37.py'
      - 'tools/verify-vol38.cpp'
      - 'tools/verify-vol39.cpp'
      - 'tools/triple_stats.py'
      - 'tools/variety_vol40.py'
      - 'tools/test_vol40.py'
      - 'tools/audit_vol40.py'
      - 'tools/verify-vol41.cpp'
      - 'tools/benchmark_vol42.py'
      - 'tools/variety_distribution_vol42.py'
      - 'tools/test_variety_distribution_vol42.py'
      - 'tools/tile_count_history_vol41.py'
      - 'tools/test_tile_count_history_vol41.py'
      - 'tools/outcome_history_vol44.py'
      - 'tools/test_outcome_history_vol44.py'
      - 'src/telemetry/**'
      - 'tools/parse-vol51-partition.py'
      - 'tools/test_vol51_partition.py'
      - 'tools/benchmark-vol52-report.py'
      - '.github/workflows/number-rush-safety.yml'
  pull_request:
    paths:
      - 'tools/verify-vol32.cpp'
      - 'tools/verify-vol33.cpp'
      - 'tools/verify-vol34.cpp'
      - 'tools/verify-vol35.cpp'
      - 'tools/verify-vol36.py'
      - 'tools/verify-vol37.py'
      - 'tools/verify-vol38.cpp'
      - 'tools/verify-vol39.cpp'
      - 'tools/triple_stats.py'
      - 'tools/variety_vol40.py'
      - 'tools/test_vol40.py'
      - 'tools/audit_vol40.py'
      - 'tools/verify-vol41.cpp'
      - 'tools/tile_count_history_vol41.py'
      - 'tools/test_tile_count_history_vol41.py'
      - 'tools/outcome_history_vol44.py'
      - 'tools/test_outcome_history_vol44.py'
      - 'src/telemetry/**'
      - '.github/workflows/number-rush-safety.yml'
  workflow_dispatch:
jobs:
  exhaustive-five-missions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile exhaustive verifiers
        run: |
          for v in 32 33 34 35; do
            g++ -O3 -std=c++17 -Wall -Wextra tools/verify-vol${v}.cpp -o /tmp/number-rush-verify${v}
          done
      - name: Run safety regressions
        run: |
          for v in 32 33 34 35; do
            /tmp/number-rush-verify${v}
          done
      - name: Compile and verify Vol.38 DOUBLE model
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra tools/verify-vol38.cpp -o /tmp/number-rush-verify38
          /tmp/number-rush-verify38
      - name: Verify BONUS projection
        run: python3 tools/verify-vol36.py
      - name: Verify DOUBLE sample regression
        run: python3 tools/verify-vol37.py
      - name: Smoke-check Vol.39 DOUBLE partition (not full G4)
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra tools/verify-vol39.cpp -o /tmp/number-rush-verify39
          /tmp/number-rush-verify39 0 128 0 46656 | tee /tmp/vol39-smoke.log
          grep -q 'pairs=5971968 states=64525248 routes=376233984' /tmp/vol39-smoke.log
          grep -q 'FREE valid=64525248 zero=0' /tmp/vol39-smoke.log
      - name: Test Vol.40 statistics, tie-breaking and audit failure mode
        run: python3 -m unittest discover -s tools -p 'test_vol40.py' -v
      - name: Cross-check optimized Vol.41 with Vol.39 partition
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra tools/verify-vol41.cpp -o /tmp/number-rush-verify41
          /tmp/number-rush-verify41 0 128 0 46656 > /tmp/vol41.log
          /tmp/number-rush-verify39 0 128 0 46656 > /tmp/vol39-reference.log
          diff -u /tmp/vol39-reference.log /tmp/vol41.log
      - name: Test 20-question tile-count history
        run: python3 -m unittest discover -s tools -p 'test_tile_count_history_vol41.py' -v
      - name: Test TRIPLE telemetry adapter
        run: node --test src/telemetry/triple-telemetry.test.mjs
      - name: Test Vol.42 distribution-adjusted variety
        run: python3 -m unittest discover -s tools -p 'test_variety_distribution_vol42.py' -v
      - name: Test Vol.42 telemetry exports
        run: node --test src/telemetry/triple-export.test.mjs
      - name: Test Vol.43 versioned local telemetry storage
        run: node --test src/telemetry/triple-storage.test.mjs
      - name: Test Vol.44 outcome-aware history
        run: python3 -m unittest discover -s tools -p 'test_outcome_history_vol44.py' -v
      - name: Test Vol.44 TRIPLE autosave and recovery
        run: node --test src/telemetry/triple-autosave.test.mjs

      - name: Test Vol.45 restart-safe TRIPLE IDs
        run: node --test src/telemetry/triple-idempotent.test.mjs

      - name: Test Vol.46 browser history persistence and TRIPLE migration
        run: node --test src/telemetry/variety-history-storage.test.mjs src/telemetry/triple-migrate-v46.test.mjs

      - name: Test Vol.47 persistent answer IDs and unified TRIPLE initialization
        run: node --test src/telemetry/variety-history-idempotent-v47.test.mjs src/telemetry/triple-init-v47.test.mjs

      - name: Test Vol.48 Variety migration and TRIPLE cross-tab lock
        run: node --test src/telemetry/variety-history-migrate-v48.test.mjs src/telemetry/triple-tab-lock-v48.test.mjs

      - name: Test Vol.49 Variety boot migration and locked TRIPLE runtime
        run: node --test src/telemetry/variety-init-v49.test.mjs src/telemetry/triple-runtime-v49.test.mjs

      - name: Test Vol.50 Variety cross-tab locking and TRIPLE storage UI states
        run: node --test src/telemetry/variety-tab-lock-v50.test.mjs src/telemetry/triple-storage-ui-v50.test.mjs

      - name: Test Vol.51 game adapters and partition coverage
        run: |
          node --test src/telemetry/variety-game-adapter-v51.test.mjs src/telemetry/triple-game-ui-adapter-v51.test.mjs
          python3 -m unittest discover -s tools -p 'test_vol51_partition.py' -v

      - name: Test Vol.52 answer IDs and TRIPLE DOM renderer
        run: node --test src/telemetry/answer-id-v52.test.mjs src/telemetry/triple-dom-status-v52.test.mjs

      - name: Test Vol.53 committed-answer and TRIPLE HUD bridges
        run: node --test src/telemetry/committed-answer-bridge-v53.test.mjs src/telemetry/triple-hud-bridge-v53.test.mjs
