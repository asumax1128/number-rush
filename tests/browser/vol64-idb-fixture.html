<!doctype html><html lang="ja"><meta charset="utf-8"><title>Vol64 IndexedDB cross-tab fixture</title>
<button id="commit">Commit shared question</button><output id="result"></output>
<script type="module">
import {createAtomicVarietyStoreV64} from '../../src/telemetry/variety-indexeddb-atomic-v64.mjs';
const store=await createAtomicVarietyStoreV64({indexedDB});
window.vol64={store};
document.querySelector('#commit').addEventListener('click',async()=>{
 try{
  const r=await store.commit({answerKey:'shared_question_64',answerId:'q_'+crypto.randomUUID().replaceAll('-',''),outcome:'MISSION_CLEAR',consumedTileCount:3});
  document.querySelector('#result').textContent=JSON.stringify(r);
 }catch(e){document.querySelector('#result').textContent=JSON.stringify({error:String(e)});}
});
</script></html>
