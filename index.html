<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0a1024;color:#f4f7ff}*{box-sizing:border-box}body{margin:0}main{max-width:580px;margin:auto;padding:18px 15px 50px}h1{font-size:29px;letter-spacing:1px;text-align:center;margin:18px 0 5px}h1 b{color:#62d7ef}.sub{text-align:center;color:#9fb0d5;font-size:12px;letter-spacing:3px;margin-bottom:18px}.panel{background:#17213c;border:1px solid #35446d;border-radius:19px;padding:17px;margin:13px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:10px}.label{font-size:12px;color:#a7b6d6;letter-spacing:1px}.number{font-size:32px;font-weight:800}.target{text-align:center;font-size:80px;font-weight:900;color:#76d9fb;line-height:1.2}.mission{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{background:#2b3b60;padding:7px 11px;border-radius:10px;font-weight:700}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:12px 0}.tile{border:2px solid #6478ac;border-radius:17px;background:#2a3859;color:white;min-height:90px;font-size:39px;font-weight:800;position:relative;touch-action:manipulation}.tile.selected{border-color:#75e5f7;background:#216d91;transform:scale(.97)}.tile .kind{display:block;font-size:12px;font-weight:700;color:#fbd486}.tile .pos{position:absolute;top:6px;left:9px;font-size:12px;color:#b3c2e4}.sum{text-align:center;font-size:19px;margin:13px}.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}button{cursor:pointer;font:inherit}button:disabled{opacity:.5}.action{background:#344464;color:white;border:1px solid #7084ae;border-radius:14px;padding:16px;font-weight:800}.primary{background:linear-gradient(100deg,#4bb3ce,#4779e7);border:0;color:white}.wide{width:100%;margin-top:12px}.notice{text-align:center;min-height:24px;margin:10px;color:#b9f4ff}.queue{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.q{padding:8px;background:#314263;border-radius:9px}.overlay{position:fixed;inset:0;background: <main><h1>NUMBER<b>×</b>RUSH</h1><div class="sub">CHAIN RUSH · PLAYTEST v0.3</div><section class="panel"><div class="stats"><div><div class="label">TIME</div><div id="time" class="number">60.0</div></div><div><div class="label">SCORE</div><div id="score" class="number">0</div></div><div><div class="label">CHAIN</div><div id="chain" class="number">0</div></div></div><p class="label">CHAIN GAUGE <span id="mult" style="float:right">×1.0</span></p><div style="height:9px;background:#293958;border-radius:9px;overflow:hidden"><div id="gauge" style="background:#55c8e7;width:0;height:100%"></div></div></section>

<section class="panel"><div id="tiles" class="tiles"></div><div class="sum">選択合計 <strong id="sum">0</strong> / <strong id="target2">—</strong></div><div class="actions"><button id="clear" class="action">CLEAR</button><button id="submit" class="action primary">決定！</button></div><div id="notice" class="notice" aria-live="polite"></div><button id="refresh" class="action wide">↻ REFRESH（残り <span id="stock">1</span>）</button></section>

<div id="overlay" class="overlay"><div class="dialog"><h2 id="dialogTitle">NUMBER×RUSH</h2><p id="dialogText">6枚のタイルから合計がTARGETになる組み合わせを選ぼう。MISSIONも達成すると高得点！</p><div id="diff" class="diff"><button data-diff="EASY">EASY</button><button class="active" data-diff="NORMAL">NORMAL</button><button data-diff="HARD">HARD</button></div><button id="start" class="action primary wide">PLAY ▶</button></div></div><noscript>JavaScriptを有効にしてください。ChatGPTのファイルプレビューでは動作しない場合があります。</noscript>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),M=['FREE','PAIR','TRIPLE','ODD','EVEN'],help={FREE:'合計を合わせよう',PAIR:'ちょうど2枚',TRIPLE:'ちょうど3枚',ODD:'元の数字が奇数のタイルを含む',EVEN:'元の数字が偶数のタイルを含む'};let diff='NORMAL',board=[],queue=[],target=0,mission='FREE',next=null,selected=new Set(),score=0,chain=0,stock=1,seconds=60,earned=0,playing=false,clock=null,last=0,serial=0,round=0,reward=null;const rnd=n=>Math.floor(Math.random()*n),kind=()=>{let r=Math.random();return diff==='EASY'?(r<.1?'BONUS':'NORMAL'):diff==='NORMAL'?(r<.1?'BONUS':r<.2?'DOUBLE':'NORMAL'):(r<.1?'BONUS':r<.2?'DOUBLE':r<.3?'REVERSE':'NORMAL')},tile=()=>({id:++serial,value:1+rnd(diff==='EASY'?6:9),kind:kind()}),eff=t=>t.value*(t.kind==='DOUBLE'?2:t.kind==='REVERSE'?-1:1),ok=(m,a)=>m==='FREE'||m==='PAIR'&&a.length===2||m==='TRIPLE'&&a.length===3||m==='ODD'&&a.some(x=>x.value%2)||m==='EVEN'&&a.some(x=>x.value%2===0);function subs(b){let out=[];for(let mask=1;mask<64;mask++){let a=b.filter((_,i)=>mask&(1<<i));out.push({mask,a,sum:a.reduce((s,x)=>s+eff(x),0)})}return out}function opts(b){let s=subs(b),out=[];for(let m of M){let counts=new Map();for(let x of s)if(x.sum>0&&ok(m,x.a))counts.set(x.sum,(counts.get(x.sum)||0)+1);for(let [t,count] of counts)out.push({mission:m,target:t,count})}return out}function best(b){let o=opts(b);if(!o.length)return null;let ideal=diff==='EASY'?5:diff==='NORMAL'?3:2;o.sort((a,b)=>Math.abs(a.count-ideal)-Math.abs(b.count-ideal));return o[rnd(Math.min(12,o.length))]}function successors(b,q,t){return subs(b).filter(x=>x.sum===t).map(x=>{let n=b.slice(),j=0;for(let i=0;i<6;i++)if(x.mask&(1<<i))n[i]=q[j++];return n})}function candidates(b,q,t){let bs=successors(b,q,t);if(!bs.length)return [];let lists=bs.map(opts);return lists[0].filter(x=>lists.every(ls=>ls.some(y=>x.target===y.target&&x.mission===y.mission)))}function pick(b,q,t){let a=candidates(b,q,t);if(!a.length)return null;let other=a.filter(x=>x.mission!=='FREE');let pool=other.length&&Math.random()<.7?other:a;return pool[rnd(pool.length)]}function ensure(){while(queue.length<6)queue.push(tile())}function multiplier(){return chain>=30?3:chain>=20?2.5:chain>=10?2:chain>=5?1.5:1}function gain(n){let v=chain+n;if(v>30)score+=(v-30)*10;chain=Math.max(0,Math.min(30,v))}function newReward(){let tier=mission==='FREE'?1:mission==='TRIPLE'?3:2,r=Math.random();reward={tier,type:r<.45?'SCORE':r<.7?'CHAIN':r<.9?'TIME':'REFRESH'}}function rewardText(){if(!reward)return '—';return reward.type==='SCORE'?'+'+(reward.tier*50)+'pt':reward.type==='CHAIN'?'CHAIN +'+reward.tier:reward.type==='TIME'?'+2秒':'REFRESH +1'}function award(){if(reward.type==='SCORE')score+=reward.tier*50;else if(reward.type==='CHAIN')gain(reward.tier);else if(reward.type==='TIME'){let n=Math.min(2,10-earned);if(n){seconds+=n;earned+=n}else score+=50}else if(stock<2)stock++;else score+=75}function draw(){for(let [id,v] of [['time',seconds.toFixed(1)],['score',Math.floor(score).toLocaleString()],['chain',chain],['mult','×'+multiplier().toFixed(1)],['target',target],['target2',target],['mission',mission],['missionhelp',help[mission]],['reward',rewardText()],['nextTarget',next?.target??'—'],['nextMission',next?.mission??'—'],['stock',stock]])$(id).textContent=v;$('gauge').style.width=chain/30*100+'%';$('refresh').disabled=!playing||!stock;let a=board.filter(x=>selected.has(x.id));$('sum').textContent=a.reduce((s,x)=>s+eff(x),0);$('tiles').replaceChildren(...board.map((x,i)=>{let b=document.createElement('button');b.className='tile'+(selected.has(x.id)?' selected':'');b.innerHTML='<span class="pos">'+(i+1)+'</span>'+x.value+'<span class="kind">'+(x.kind==='NORMAL'?'':x.kind==='DOUBLE'?'×2':x.kind==='REVERSE'?'−':'★ BONUS')+'</span>';b.onclick=()=>{if(!playing)return;selected.has(x.id)?selected.delete(x.id):selected.add(x.id);draw()};return b}));$('queue').replaceChildren(...queue.slice(0,5).map(x=>{let e=document.createElement('span');e.className='q';e.textContent=(x.kind==='DOUBLE'?'×2 ':x.kind==='REVERSE'?'− ':x.kind==='BONUS'?'★ ':'')+x.value;return e}))}function notice(s){$('notice').textContent=s}function finish(){playing=false;clearInterval(clock);$('dialogTitle').textContent='TIME UP!';$('dialogText').textContent='SCORE '+Math.floor(score).toLocaleString()+' ／ '+round+'問';$('start').textContent='もう一度 PLAY ▶';$('overlay').classList.remove('hidden');draw()}function begin(){clearInterval(clock);board=Array.from({length:6},tile);queue=[];ensure();selected.clear();score=chain=earned=round=0;stock=1;seconds=60;playing=true;let op=best(board);mission=op.mission;target=op.target;newReward();next=pick(board,queue,target);notice('MISSION CLEARを狙おう！');$('overlay').classList.add('hidden');last=performance.now();clock=setInterval(()=>{if(!playing)return;let now=performance.now();seconds=Math.max(0,seconds-(now-last)/1000);last=now;if(seconds<=0)finish();else $('time').textContent=seconds.toFixed(1)},50);draw()}function advance(mask){let j=0;for(let i=0;i<6;i++)if(mask&(1<<i))board[i]=queue[j++];queue.splice(0,j);ensure();selected.clear();round++;let op=next||best(board);mission=op.mission;target=op.target;newReward();next=pick(board,queue,target)}$('submit').onclick=()=>{if(!playing||!selected.size)return;let a=board.filter(x=>selected.has(x.id)),sum=a.reduce((s,x)=>s+eff(x),0),mask=board.reduce((m,x,i)=>m|(selected.has(x.id)?1<<i:0),0);if(sum!==target){gain(-3);seconds=Math.max(0,seconds-1);notice('MISS！ −1秒');if(seconds<=0)finish();else draw();return}if(ok(mission,a)){score+=(100+a.filter(x=>x.kind==='BONUS').length*50)*multiplier();gain(1);award();notice('MISSION CLEAR！')}else{score+=20;gain(-2);notice('TARGET CLEAR +20pt')}advance(mask);draw()};$('clear').onclick=()=>{selected.clear();draw()};$('refresh').onclick=()=>{if(!playing||stock<1)return;let choices=[];for(let mask=1;mask<63;mask++){let b=board.slice(),j=0;for(let i=0;i<6;i++)if(mask&(1<<i))b[i]=queue[j++];if(!opts(b).some(x=>x.mission===mission&&x.target===target))continue;let q=queue.slice(j);while(q.length<6)q.push(tile());if(next&&candidates(b,q,target).some(x=>x.mission===next.mission&&x.target===next.target))choices.push({b,q})}if(!choices.length){notice('安全なREFRESH候補なし');return}let x=choices[rnd(choices.length)];board=x.b;queue=x.q;stock--;selected.clear();notice('REFRESH！');draw()};$('start').onclick=()=>{try{begin()}catch(e){console.error(e);$('dialogText').textContent='開始エラー: '+e.message}};document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{diff=b.dataset.diff;document.querySelectorAll('[data-diff]').forEach(x=>x.classList.toggle('active',x===b))});document.documentElement.dataset.jsReady='yes';})();</script>
